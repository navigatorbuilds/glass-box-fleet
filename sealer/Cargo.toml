[package]
name = "glass-box-sealer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Seals agent action-events into signed, hash-linked evidence records (published elara-record format)"

[dependencies]
elara-record = "=0.3.0"
dilithium-rs = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
